version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
#  TruthLens — Cross-Lingual Multimodal Fake News Verification System
#  Docker Compose: Backend (FastAPI) + Frontend (Next.js) + optional Neo4j
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ─── FastAPI AI Backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truthlens-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=TruthLens Fact-Verification System
      - APP_VERSION=1.0.0
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - FRONTEND_URL=http://localhost:3000
      # Database – override with real credentials in production
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      # AI Keys – set in .env file
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash-exp}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - NLI_MODEL=${NLI_MODEL:-cross-encoder/nli-deberta-v3-small}
      # Scoring weights
      - NLI_WEIGHT=${NLI_WEIGHT:-0.40}
      - BM25_WEIGHT=${BM25_WEIGHT:-0.20}
      - DENSE_WEIGHT=${DENSE_WEIGHT:-0.25}
      - GRAPH_WEIGHT=${GRAPH_WEIGHT:-0.15}
    volumes:
      - ./backend/data:/app/data:ro   # Mount dataset CSVs read-only
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - truthlens-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Next.js Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: truthlens-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - truthlens-net

  # ─── Neo4j Graph Database (optional — system uses NetworkX fallback) ─────────
  neo4j:
    image: neo4j:5.13-community
    container_name: truthlens-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - truthlens-net
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-password}", "RETURN 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # ─── Qdrant Vector Database (optional — system uses in-memory fallback) ─────
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: truthlens-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - truthlens-net
    profiles:
      - full   # Only starts with: docker compose --profile full up

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  truthlens-net:
    driver: bridge
